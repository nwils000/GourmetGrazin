      - region "About Gourmet Grazin'" [ref=f33e130]:
        - generic [ref=f33e132]:
          - figure [ref=f33e133]:
            - img "Gourmet Grazin' mobile charcuterie cart styled with artisan cheeses and cured meats at an outdoor Kentucky event" [ref=f33e135]
          - generic [ref=f33e136]:
            - paragraph [ref=f33e137]: Meet the Cart
            - heading [level=2] [ref=f33e138]:
              - text: More than catering.It's an
              - emphasis [ref=f33e139]: experience.
            - paragraph [ref=f33e140]: Gourmet Grazin' brings a one-of-a-kind charcuterie experience to your event with our custom-built mobile cart. Stocked with artisan cheeses, cured meats, fresh fruits, gourmet crackers, and all the fixings, beautifully arranged and served right where your guests are.
            - paragraph [ref=f33e141]: Whether it's a wedding cocktail hour, a corporate reception, or an intimate gathering, our cart adds an elevated touch that your guests will remember. Based in Kentucky, we bring the graze to you.
            - generic [ref=f33e142]:
              - link "Explore Our Services →" [ref=f33e143] [cursor=pointer]:
                - /url: "#services"
              - link "Shop the Collection →" [ref=f33e144] [cursor=pointer]:
                - /url: /shop
